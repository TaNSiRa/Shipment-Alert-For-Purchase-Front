name: purchase_shipment_alert
description: Purchase Shipment Alert — Flutter web client.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  intl: ^0.20.1
  socket_io_client: ^3.0.2
  universal_html: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - logo_tpk.png
  # Same faces as RAP, bundled (no Google Fonts CDN — factory PCs are offline).
  # Anuphan draws Thai and Latin from one family; JetBrains Mono is for numbers.
  # Both SIL OFL 1.1 — see assets/fonts/*-OFL.txt.
  fonts:
    - family: Anuphan
      fonts:
        - asset: assets/fonts/Anuphan-400.ttf
          weight: 400
        - asset: assets/fonts/Anuphan-500.ttf
          weight: 500
        - asset: assets/fonts/Anuphan-600.ttf
          weight: 600
        - asset: assets/fonts/Anuphan-700.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-700.ttf
          weight: 700
    # Flutter web fetches Roboto from the internet for any text that names no
    # family; pointing Roboto at Anuphan makes that fetch unnecessary offline.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Anuphan-400.ttf
          weight: 400
        - asset: assets/fonts/Anuphan-500.ttf
          weight: 500
        - asset: assets/fonts/Anuphan-600.ttf
          weight: 600
        - asset: assets/fonts/Anuphan-700.ttf
          weight: 700
